<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a10">
  <title>RoamRIT · Log in</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="boot-loader" id="boot-loader" aria-hidden="true">
    <span class="boot-mark">RIT</span>
  </div>

  <div class="ambient" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <div class="auth-shell" id="auth-shell" hidden>
    <a class="brand auth-brand" href="index.html" aria-label="RoamRIT home">
      <span class="brand-mark" aria-hidden="true">RIT</span>
      <span class="brand-name">Roam<em>RIT</em></span>
    </a>

    <section class="view auth-view auth-standalone">
      <div class="hero">
        <h1 id="auth-heading">Welcome to RoamRIT</h1>
        <p class="hero-sub" id="auth-sub">Log in to post on the community board, add spots, and leave reviews under your name.</p>
      </div>

      <p class="field full auth-error" id="auth-fatal" hidden></p>

      <div class="mode-toggle" id="auth-mode-toggle" role="tablist" aria-label="Choose log in or sign up">
        <button class="mode-btn" type="button" data-auth-mode="login" aria-pressed="true" role="tab">Log in</button>
        <button class="mode-btn" type="button" data-auth-mode="signup" aria-pressed="false" role="tab">Sign up</button>
      </div>

      <form class="form-panel contribution-form auth-form" id="auth-form">
        <div class="form-title-row">
          <div><h2 id="auth-form-title">Log in</h2><p class="panel-kicker" id="auth-form-kicker">Welcome back.</p></div>
        </div>
        <div class="form-grid">
          <label class="field full" id="auth-name-field" hidden><span class="field-label">Display name</span><input class="field-input" id="auth-name" type="text" maxlength="40" placeholder="e.g. Ananya"></label>
          <label class="field full"><span class="field-label">Email</span><input class="field-input" id="auth-email" type="email" placeholder="you@msrit.edu" autocomplete="email" required></label>
          <label class="field full"><span class="field-label">Password</span><input class="field-input" id="auth-password" type="password" placeholder="••••••••" autocomplete="current-password" minlength="6" required></label>
          <p class="field full auth-error" id="auth-error" hidden></p>
        </div>
        <div class="form-actions"><button class="btn-solid" id="auth-submit" type="submit">Log in</button></div>
      </form>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="login.js"></script>
</body>
</html>
